apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abhisharma078/Argocd-k8s.git
    targetRevision: main
    path: Declarative-approach/tomcat
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true