apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-deploy
  labels:
    app: tomcat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tomcat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      containers:
      -  name: tomcat-cont
         image: tomcat:10.1
         ports:
          - containerPort: 8080

         resources:
           requests:
             cpu: "100m"
             memory: "64Mi"
           limits: 
             cpu: "200m"
             memory: "128Mi"
           


         

