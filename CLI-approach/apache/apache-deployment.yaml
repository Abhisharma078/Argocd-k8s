apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deploy
  labels:
    app: apache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      -  name: apache-cont
         image: httpd:latest
         ports:
          - containerPort: 80

         resources:
           requests:
             cpu: "100m"
             memory: "64Mi"
           limits: 
             cpu: "200m"
             memory: "128Mi"
           


         

